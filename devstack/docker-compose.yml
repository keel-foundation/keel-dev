name: tubekeel

services:
  postgres:
    image: postgres:16-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tubekeel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tubekeel-dev}
      POSTGRES_DB: ${POSTGRES_DB:-tubekeel}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tubekeel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:2026.10
    environment:
      SERVICES: s3
      DEBUG: "0"
      PERSISTENCE: "1"
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

  localstack-init:
    image: localstack/localstack:2026.10
    depends_on:
      localstack:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until awslocal --endpoint-url=http://localstack:4566 s3 ls >/dev/null 2>&1; do sleep 1; done;
      awslocal --endpoint-url=http://localstack:4566 s3 mb s3://tubekeel || true;
      awslocal --endpoint-url=http://localstack:4566 s3 mb s3://tubekeel-public || true;
      awslocal --endpoint-url=http://localstack:4566 s3api put-bucket-acl --bucket tubekeel-public --acl public-read || true;
      "
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_ENDPOINT_URL: http://localstack:4566
      LOCALSTACK_HOST: localstack

  nats:
    image: nats:2.10-alpine3.22
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data

volumes:
  postgres-data:
  localstack-data:
  nats-data:
